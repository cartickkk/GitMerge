<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitMerge | Find Teams</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/cards.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-brand">
            <span>GitMerge</span>
            <span class="brand-badge">lab-build</span>
        </div>
        <ul class="nav-links">
            <li><a href="../index.html" class="nav-item">Home</a></li>
            <li><a href="find-teammates.html" class="nav-item">Find Teammates</a></li>
            <li><a href="find-teams.html" class="nav-item active">Find Teams</a></li>
            <li><a href="match-engine.html" class="nav-item">Match Engine</a></li>
            <li><a href="create-squad.html" class="nav-item">Post a Team</a></li>
        </ul>
        <div class="nav-right">
            <span class="engine-status"><span class="pulse-dot"></span>Port 8080</span>
            <a href="profile.html" class="btn-profile-link">My Profile</a>
        </div>
    </header>

    <main class="directory-container">
        <header class="directory-header">
            <span class="directory-badge">Active Openings</span>
            <h1>Open Squads</h1>
            <p>Find teams actively seeking your skills to complete their 4-person roster.</p>
        </header>

        <section class="filter-bar">
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="squadSearchInput" class="search-input" placeholder="Search by team name, needed role, or track...">
            </div>
        </section>

        <section class="card-grid" id="teamsGrid">
            <!-- Populated via teams.js -->
        </section>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/teams.js"></script>
</body>
</html>
